name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy business_manager/frontend --project-name=ai-manager --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published site
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --location --fail --silent --show-error --retry 6 --retry-delay 5 --output "$RUNNER_TEMP/site.html" "$DEPLOYMENT_URL"
          grep -q 'Business Manager' "$RUNNER_TEMP/site.html"
