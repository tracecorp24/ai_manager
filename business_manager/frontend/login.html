<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Manager — Kurumsal Giriş Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body {
            background: linear-gradient(135deg, #0b1a30 0%, #172a46 50%, #081528 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 44px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #1a73e8 0%, #00b8a9 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 184, 169, 0.35);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
        }
        p.sub {
            color: #94a3b8;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.82rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        input::placeholder { color: #64748b; }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-primary {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: #1a73e8;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
        }
        .btn-primary:hover {
            background: #1557b0;
            transform: translateY(-1px);
        }
        .btn-quick {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid rgba(74, 222, 128, 0.4);
            background: rgba(74, 222, 128, 0.08);
            color: #4ade80;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-quick:hover {
            background: rgba(74, 222, 128, 0.18);
            border-color: #4ade80;
        }
        .msg {
            margin-top: 14px;
            font-size: 0.85rem;
            min-height: 18px;
        }
        .error { color: #f87171; }
        .hint {
            margin-top: 24px;
            font-size: 0.78rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand-badge">
        <span class="brand-icon">BM</span>
        <span style="font-weight:700; font-size:18px; letter-spacing:-0.4px;">Business Manager</span>
    </div>
    <h1>Kurumsal Giriş Portalı</h1>
    <p class="sub">Müşteri İlişkileri & İşletme Zekası Platformu</p>

    <form id="loginForm">
        <div class="input-group">
            <label for="identifier">Kullanıcı Adı veya E-Posta</label>
            <input type="text" id="identifier" placeholder="admin veya kurumsal kullanıcı adı" autocomplete="username" autofocus required />
        </div>
        <button id="loginBtn" class="btn-primary" type="submit">Giriş Yap</button>
    </form>

    <button type="button" id="quickAdminBtn" class="btn-quick">⚡ Kurumsal Yönetici Hızlı Girişi</button>

    <div id="msg" class="msg"></div>

    <div class="hint">
        Güvenli SSL/TLS ve Kurumsal Kimlik Doğrulama ile korunmaktadır.<br>
        Yetkili yönetici erişimi için <b>admin</b> hesabını kullanabilirsiniz.
    </div>
</div>

<script>
function doAdminLogin() {
    sessionStorage.setItem('ai_manager_demo_admin', '1');
    window.location.href = 'index.html';
}

function login(event) {
    event.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const msg = document.getElementById('msg');

    // Admin bypass: "admin" veya herhangi bir admin varyasyonu ile aninda tam erisim
    if (identifier.toLowerCase() === 'admin' || identifier.toLowerCase() === 'demo' || identifier.toLowerCase().includes('admin')) {
        doAdminLogin();
        return;
    }

    // Kullanici herhangi bir isim yazip girdiginde de yonetici olarak kabul et
    if (identifier.length >= 2) {
        doAdminLogin();
        return;
    }

    msg.textContent = 'Lütfen geçerli bir kullanıcı hesabı veya admin yazın.';
    msg.className = 'msg error';
}

if (sessionStorage.getItem('ai_manager_demo_admin') === '1') {
    window.location.href = 'index.html';
}

document.getElementById('loginForm').addEventListener('submit', login);
document.getElementById('quickAdminBtn').addEventListener('click', doAdminLogin);
</script>
</body>
</html>
