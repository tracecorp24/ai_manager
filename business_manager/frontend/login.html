<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — AI Manager Platformu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0b2b40 0%, #10425a 50%, #081d2c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 44px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 4px 10px rgba(0, 184, 169, 0.4));
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        p.sub {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 28px;
            font-size: 0.92rem;
        }
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        input:focus {
            border-color: #00b8a9;
            box-shadow: 0 0 0 3px rgba(0, 184, 169, 0.25);
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #00b8a9 0%, #1f7a8c 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 18px rgba(0, 184, 169, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(0, 184, 169, 0.4);
        }
        .btn-quick {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #4ade80;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-quick:hover {
            background: rgba(74, 222, 128, 0.15);
            border-color: #4ade80;
        }
        .msg {
            margin-top: 16px;
            font-size: 0.88rem;
            min-height: 20px;
        }
        .error { color: #f87171; }
        .hint {
            margin-top: 24px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">⚡</div>
    <h1>AI Manager</h1>
    <p class="sub">İşletme & Mekanik CRM Yönetim Platformu</p>

    <form id="loginForm">
        <div class="input-group">
            <label for="identifier">Kullanıcı Adı (Bypass: admin)</label>
            <input type="text" id="identifier" placeholder="Kullanıcı adı veya 'admin'" autocomplete="username" autofocus required />
        </div>
        <button id="loginBtn" class="btn-primary" type="submit">Giriş Yap</button>
    </form>

    <button type="button" id="quickAdminBtn" class="btn-quick">⚡ Tek Tıkla Admin Hızlı Giriş</button>

    <div id="msg" class="msg"></div>

    <div class="hint">
        Test modundasınız. Kullanıcı adına <b>admin</b> yazarak veya hızlı giriş butonuna basarak tüm yetkilerle anında giriş yapabilirsiniz.
    </div>
</div>

<script>
function doAdminLogin() {
    sessionStorage.setItem('ai_manager_demo_admin', '1');
    window.location.href = '/index.html';
}

function login(event) {
    event.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const msg = document.getElementById('msg');

    // Admin bypass: "admin" yazildiginda tum engeller kalkar
    if (identifier.toLowerCase() === 'admin' || identifier.toLowerCase() === 'demo') {
        doAdminLogin();
        return;
    }

    msg.textContent = 'Giriş için admin yazın veya aşağıdaki butonu kullanın.';
    msg.className = 'msg error';
}

if (sessionStorage.getItem('ai_manager_demo_admin') === '1') {
    window.location.href = '/index.html';
}

document.getElementById('loginForm').addEventListener('submit', login);
document.getElementById('quickAdminBtn').addEventListener('click', doAdminLogin);
</script>
</body>
</html>
