<head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <!-- Kütüphaneler -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-pending body { visibility: hidden; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }

        body {
            height: 100vh;
            overflow: hidden;
            background: #090d16;
            color: #f8fafc;
        }

        :root {
            --theme-primary: #0f172a;
            --theme-accent: #0284c7;
            --theme-accent-glow: rgba(2, 132, 199, 0.4);
            --theme-border: #0284c7;
            --theme-gradient-start: #0f172a;
            --theme-gradient-end: #0369a1;
            --theme-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        body.theme-saas {
            --theme-primary: #090d16;
            --theme-accent: #38bdf8;
            --theme-border: #38bdf8;
            --theme-gradient-start: #030712;
            --theme-gradient-end: #0c4a6e;
        }
        body.theme-mobile {
            --theme-primary: #18181b;
            --theme-accent: #a855f7;
            --theme-border: #a855f7;
            --theme-gradient-start: #18181b;
            --theme-gradient-end: #6b21a8;
        }
        body.theme-portfolio {
            --theme-primary: #111827;
            --theme-accent: #10b981;
            --theme-border: #10b981;
            --theme-gradient-start: #064e3b;
            --theme-gradient-end: #111827;
        }
        body.theme-strategy {
            --theme-primary: #1c1917;
            --theme-accent: #f59e0b;
            --theme-border: #f59e0b;
            --theme-gradient-start: #78350f;
            --theme-gradient-end: #1c1917;
        }

        /* Ana Düzen */
        .app-container {
            display: grid;
            grid-template-columns: 260px 1fr 320px;
            height: 100vh;
            background: #0f172a;
        }

        /* Sol Panel - Şablonlar & Medya */
        .media-panel {
            background: #111827;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 2;
        }
        .panel-header {
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--theme-gradient-start) 0%, var(--theme-gradient-end) 100%);
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .panel-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tpl-picker-box {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .tpl-card-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            text-align: left;
        }
        .tpl-card-btn:hover, .tpl-card-btn.active {
            background: rgba(2, 132, 199, 0.2);
            border-color: #38bdf8;
            color: #fff;
            transform: translateX(3px);
        }

        /* Orta Panel - Canvas */
        .canvas-panel {
            overflow-y: auto;
            padding: 30px 40px;
            background: #030712;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-toolbar {
            width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 14px;
            margin-bottom: 24px;
        }
        .slides-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
        }

        /* Slayt Boyutları ve Şablonları (16:9 Oranında 950x534) */
        .slide {
            background: #ffffff;
            color: #0f172a;
            width: 950px;
            min-height: 534px;
            height: 534px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .slide-header-bar {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 8px;
            z-index: 50;
        }
        .btn-slide-action {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: rgba(0,0,0,0.6);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-slide-action:hover { background: #ef4444; }

        /* Slayt Türleri */
        /* 1. Kapak Slaytı */
        .slide-type-cover {
            background: linear-gradient(135deg, var(--theme-gradient-start) 0%, #030712 60%, var(--theme-gradient-end) 100%);
            color: #fff;
            padding: 60px;
            justify-content: center;
            position: relative;
        }
        .slide-type-cover .cover-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .slide-type-cover h1 {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.8px;
            margin-bottom: 14px;
            max-width: 800px;
        }
        .slide-type-cover p {
            font-size: 1.15rem;
            color: #94a3b8;
            max-width: 650px;
            line-height: 1.5;
        }

        /* 2. Problem vs Çözüm İki Sütunlu Slayt */
        .slide-type-dual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100%;
        }
        .dual-col-left {
            background: #0f172a;
            color: #fff;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 2px solid rgba(255,255,255,0.08);
        }
        .dual-col-right {
            background: #1e293b;
            color: #fff;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 3. Metrik & Traksiyon Slaytı */
        .slide-type-metrics {
            background: #090d16;
            color: #fff;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 30px;
        }
        .metric-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 20px 16px;
            text-align: center;
        }
        .metric-num {
            font-size: 2.2rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }
        .metric-lbl {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 600;
        }

        /* 4. Paket & Fiyatlandırma Slaytı */
        .slide-type-pricing {
            background: #0f172a;
            color: #fff;
            padding: 35px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .pricing-deck-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 24px;
        }
        .pricing-deck-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .pricing-deck-card.featured {
            background: rgba(2, 132, 199, 0.12);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
        }

        /* 5. Yol Haritası Slaytı (Roadmap) */
        .slide-type-roadmap {
            background: #0f172a;
            color: #fff;
            padding: 40px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .roadmap-timeline {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 30px;
            position: relative;
        }
        .roadmap-step {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            border-top: 4px solid #38bdf8;
        }

        /* Sağ Panel - Kontroller */
        .settings-panel {
            background: #111827;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 22px;
            gap: 18px;
        }
        .ctrl-group label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .ctrl-input, .ctrl-select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .ctrl-select option { background: #111827; color: #fff; }
        .btn-ctrl-primary {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-ctrl-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }

        .btn-ctrl-secondary {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: #cbd5e1;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }
        .btn-ctrl-secondary:hover { background: rgba(255,255,255,0.12); color:#fff; }

        /* Tam Ekran Canlı Sunum Modu Overlay */
        #presenterOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #030712;
            z-index: 999999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #presenterOverlay.active { display: flex; }
        .presenter-viewport {
            transform: scale(1.15);
            transform-origin: center center;
        }
        .presenter-nav-bar {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 30px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

let currentDeck = JSON.parse(JSON.stringify(PRESETS.saas));
let presenterIndex = 0;
let presenterTimerInterval = null;
let presenterSeconds = 0;

function renderDeck() {
    const container = document.getElementById('slidesContainer');
    if (!container) return;

    container.innerHTML = '';
    document.body.className = currentDeck.theme || 'theme-saas';
    document.getElementById('deckTitleDisplay').textContent = `📊 ${currentDeck.title}`;
    document.getElementById('slideCountText').textContent = `${currentDeck.slides.length} Slayt`;
    document.getElementById('deckTitleInput').value = currentDeck.title;
    document.getElementById('companyInput').value = currentDeck.company;
    document.getElementById('themeSelect').value = currentDeck.theme;

    currentDeck.slides.forEach((s, idx) => {
        const slideEl = createSlideElement(s, idx);
        container.appendChild(slideEl);
    });
}

function createSlideElement(s, idx) {
    const el = document.createElement('div');
    el.className = `slide slide-type-${s.type}`;
    el.dataset.index = idx;

    // Slayt Üstü Kontroller
    const header = document.createElement('div');
    header.className = 'slide-header-bar';
    header.innerHTML = `
        <span style="font-size:11px; font-weight:700; color:rgba(255,255,255,0.6); margin-right:6px; display:flex; align-items:center;">#${idx + 1}</span>
        <button class="btn-slide-action" onclick="deleteSlide(${idx})" title="Slaytı Sil"><i class="fas fa-trash"></i></button>
    `;
    el.appendChild(header);

    if (s.type === 'cover') {
        el.innerHTML += `
            <div class="cover-tag"><i class="fas fa-sparkles"></i> <span contenteditable="true" onblur="updateSlideField(${idx}, 'tag', this.textContent)">${escapeHtml(s.tag || 'KURUMSAL')}</span></div>
            <h1 contenteditable="true" onblur="updateSlideField(${idx}, 'title', this.textContent)">${escapeHtml(s.title)}</h1>
            <p contenteditable="true" onblur="updateSlideField(${idx}, 'desc', this.textContent)">${escapeHtml(s.desc)}</p>
            <div style="margin-top:28px; font-size:12px; color:rgba(255,255,255,0.4); font-weight:600;">
                ${escapeHtml(currentDeck.company)} · ${new Date().toLocaleDateString('tr-TR')}
            </div>
        `;
    } else if (s.type === 'dual') {
        el.innerHTML += `
            <div class="dual-col-left">
                <h3 style="font-size:18px; font-weight:800; color:#f87171; margin-bottom:16px;">${escapeHtml(s.leftTitle)}</h3>
                <ul style="padding-left:20px; line-height:1.8; font-size:13.5px; color:#cbd5e1;">
                    ${(s.leftItems || []).map(it => `<li>${escapeHtml(it)}</li>`).join('')}
                </ul>
            </div>
            <div class="dual-col-right">
                <h3 style="font-size:18px; font-weight:800; color:#34d399; margin-bottom:16px;">${escapeHtml(s.rightTitle)}</h3>
                <ul style="padding-left:20px; line-height:1.8; font-size:13.5px; color:#cbd5e1;">
                    ${(s.rightItems || []).map(it => `<li>${escapeHtml(it)}</li>`).join('')}
                </ul>
            </div>
        `;
    } else if (s.type === 'metrics') {
        el.innerHTML += `
            <h2 style="font-size:24px; font-weight:800; margin-bottom:6px;">${escapeHtml(s.title)}</h2>
            <p style="font-size:13px; color:#94a3b8;">${escapeHtml(s.desc)}</p>
            <div class="metrics-grid">
                ${(s.metrics || []).map(m => `
                    <div class="metric-card">
                        <div class="metric-num">${escapeHtml(m.num)}</div>
                        <div class="metric-lbl">${escapeHtml(m.label)}</div>
                    </div>
                `).join('')}
            </div>
        `;
    } else if (s.type === 'pricing') {
        el.innerHTML += `
            <h2 style="font-size:22px; font-weight:800; margin-bottom:4px;">${escapeHtml(s.title)}</h2>
            <p style="font-size:12.5px; color:#94a3b8;">${escapeHtml(s.desc)}</p>
            <div class="pricing-deck-grid">
                ${(s.packages || []).map(p => `
                    <div class="pricing-deck-card ${p.featured ? 'featured' : ''}">
                        <div style="font-weight:800; font-size:14px; margin-bottom:4px;">${escapeHtml(p.name)}</div>
                        <div style="font-size:22px; font-weight:800; color:#38bdf8; margin-bottom:12px;">${escapeHtml(p.price)}</div>
                        <ul style="font-size:12px; line-height:1.7; padding-left:16px; color:#cbd5e1;">
                            ${p.feats.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
                        </ul>
                    </div>
                `).join('')}
            </div>
        `;
    } else if (s.type === 'roadmap') {
        el.innerHTML += `
            <h2 style="font-size:22px; font-weight:800; margin-bottom:4px;">${escapeHtml(s.title)}</h2>
            <p style="font-size:12.5px; color:#94a3b8;">${escapeHtml(s.desc)}</p>
            <div class="roadmap-timeline">
                ${(s.steps || []).map(st => `
                    <div class="roadmap-step">
                        <div style="font-size:11px; color:#38bdf8; font-weight:800;">${escapeHtml(st.phase)}</div>
                        <div style="font-weight:700; font-size:13px; margin:4px 0;">${escapeHtml(st.title)}</div>
                        <div style="font-size:11.5px; color:#94a3b8; line-height:1.4;">${escapeHtml(st.desc)}</div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    return el;
}

function updateSlideField(idx, field, value) {
    if (currentDeck.slides[idx]) {
        currentDeck.slides[idx][field] = value.trim();
    }
}

function deleteSlide(idx) {
    if (currentDeck.slides.length <= 1) {
        alert('Sunumda en az 1 slayt bulunmalıdır.');
        return;
    }
    currentDeck.slides.splice(idx, 1);
    renderDeck();
}

function escapeHtml(str = '') {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// ------------------- TAM EKRAN CANLI SUNUM MODU (PRESENTER) -------------------
function startPresenter() {
    presenterIndex = 0;
    presenterSeconds = 0;
    const overlay = document.getElementById('presenterOverlay');
    overlay.classList.add('active');
    updatePresenterSlide();

    clearInterval(presenterTimerInterval);
    presenterTimerInterval = setInterval(() => {
        presenterSeconds++;
        const m = String(Math.floor(presenterSeconds / 60)).padStart(2, '0');
        const s = String(presenterSeconds % 60).padStart(2, '0');
        document.getElementById('presenterTimer').textContent = `${m}:${s}`;
    }, 1000);
}

function updatePresenterSlide() {
    const box = document.getElementById('presenterSlideBox');
    box.innerHTML = '';
    const s = currentDeck.slides[presenterIndex];
    if (s) {
        const slideClone = createSlideElement(s, presenterIndex);
        slideClone.querySelector('.slide-header-bar')?.remove();
        box.appendChild(slideClone);
    }
    document.getElementById('presenterSlideIndex').textContent = `${presenterIndex + 1} / ${currentDeck.slides.length}`;
}

function nextSlide() {
    if (presenterIndex < currentDeck.slides.length - 1) {
        presenterIndex++;
        updatePresenterSlide();
    }
}

function prevSlide() {
    if (presenterIndex > 0) {
        presenterIndex--;
        updatePresenterSlide();
    }
}

function closePresenter() {
    document.getElementById('presenterOverlay').classList.remove('active');
    clearInterval(presenterTimerInterval);
}

document.getElementById('startPresenterBtn')?.addEventListener('click', startPresenter);
document.getElementById('nextSlideBtn')?.addEventListener('click', nextSlide);
document.getElementById('prevSlideBtn')?.addEventListener('click', prevSlide);
document.getElementById('closePresenterBtn')?.addEventListener('click', closePresenter);

document.addEventListener('keydown', (e) => {
    const overlay = document.getElementById('presenterOverlay');
    if (overlay && overlay.classList.contains('active')) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault();
            nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            prevSlide();
        } else if (e.key === 'Escape') {
            closePresenter();
        }
    } else {
        if (e.key === 'F5') {
            e.preventDefault();
            startPresenter();
        }
    }
});

// PDF & PPTX Dışa Aktarma
document.getElementById('exportPdfBtn')?.addEventListener('click', async () => {
    const slidesElements = document.querySelectorAll('#slidesContainer .slide');
    if (slidesElements.length === 0) return;

    const btn = document.getElementById('exportPdfBtn');
    const oldText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PDF Hazırlanıyor...';
    btn.disabled = true;

    try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        for (let i = 0; i < slidesElements.length; i++) {
            const canvas = await html2canvas(slidesElements[i], { scale: 2, backgroundColor: '#090d16' });
            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            if (i !== 0) pdf.addPage();
            pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
        }
        pdf.save(`${currentDeck.title.toLowerCase().replace(/[^a-z0-9]/g, '_')}_sunumu.pdf`);
    } catch (e) {
        alert('PDF indirme sırasında bir sorun oluştu.');
    } finally {
        btn.innerHTML = oldText;
        btn.disabled = false;
    }
});

document.getElementById('exportPptxBtn')?.addEventListener('click', () => {
    const PptxGenJS = window.PptxGenJS;
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'WIDE', width: 10, height: 5.63 });
    pptx.layout = 'WIDE';

    currentDeck.slides.forEach(s => {
        const slide = pptx.addSlide();
        slide.background = { color: '090D16' };
        if (s.type === 'cover') {
            slide.addText(s.title, { x: 1, y: 1.8, w: 8, h: 1.5, fontSize: 32, bold: true, color: 'FFFFFF', align: 'center' });
            slide.addText(s.desc || '', { x: 1, y: 3.4, w: 8, h: 1, fontSize: 16, color: '94A3B8', align: 'center' });
        } else {
            slide.addText(s.title || 'Sunum Detayı', { x: 0.8, y: 0.6, w: 8.4, h: 0.8, fontSize: 24, bold: true, color: '38BDF8' });
            slide.addText(s.desc || '', { x: 0.8, y: 1.3, w: 8.4, h: 0.6, fontSize: 13, color: '94A3B8' });
        }
    });

    pptx.writeFile({ fileName: `${currentDeck.title.toLowerCase().replace(/[^a-z0-9]/g, '_')}.pptx` });
});
